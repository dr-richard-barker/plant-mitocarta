# PMM-03 — Nuclear Transcriptional Command and Organelle Reprogramming
# MDRE cis-elements, ANAC017/013 binding, ABI4 repression, GLK1/2 activation, and XRN2/3.

id: PMM-03
title: Nuclear Transcriptional Command and Organelle Reprogramming
subtitle: >-
  The nuclear convergence hub where mitochondrial and plastid retrograde signals
  reprogram the genome to adjust bioenergetics.
species_anchor: arabidopsis_thaliana
caption: >-
  The nuclear genome receives direct signals from both endosymbiotic organelles.
  Cleaved ANAC017 and ANAC013 enter via nuclear pore complexes to bind the Mitochondrial
  Dysfunction Responsive Element (MDRE: CTTGNNNNNCAG), driving high-level transcription
  of AOX1a and mitochondrial chaperones. Concurrently, translocated PAP from chloroplasts
  inhibits 5'-to-3' exoribonucleases (XRN2/3), altering transcriptional termination.
  Plastid GUN1 signals stimulate ABI4 to repress Photosynthesis-Associated Nuclear Genes
  (PhANGs) while antagonizing GLK1/2 transcriptional activators.

