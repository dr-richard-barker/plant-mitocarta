# PMM-01 — Plant Mitochondrial Electron Transport and Oxidative Phosphorylation
# Features both conserved catalytic Complexes I-V and plant-specific non-phosphorylating
# bypasses (AOX, Type II internal/external NDHs, Complex I CA domain, PUMP).

id: PMM-01
title: Plant Mitochondrial Electron Transport and Oxidative Phosphorylation
subtitle: >-
  Conserved respiratory Complexes I–V integrated with plant-specific bypasses
  (AOX, Type II NDHs, and the Complex I Carbonic Anhydrase domain).
species_anchor: arabidopsis_thaliana
caption: >-
  The plant mitochondrial electron transport chain redrawn to contrast conserved
  catalytic complexes with plant-specific metabolic innovations. Unlike mammalian
  mitochondria (MitoCarta 3.0), plants possess cyanide-resistant alternative oxidase (AOX)
  and rotenone-insensitive type II NAD(P)H dehydrogenases (NDA/NDB/NDC), allowing
  respiratory electron flux without proton translocation when cellular energy charge is high.
  The unique matrix-facing Carbonic Anhydrase (CA) domain of Complex I is essential for
  complex stability and coordinates with photorespiratory flux.

lanes:
  - id: substrates
    compartment: mitochondrial_matrix
    node_width: 170
    nodes: [MATRIX_NADH, SUCCINATE_POOL, O2_SUBSTRATE]

  - id: dehydrogenases
    compartment: mitochondrial_inner_membrane
    node_width: 210
    nodes: [COMPLEX_I_CORE, COMPLEX_I_CA_DOMAIN, COMPLEX_II_SDH, ALT_NDH_INTERNAL, ALT_NDH_EXTERNAL]

  - id: quinone_pool
    compartment: mitochondrial_inner_membrane
    node_width: 200
    nodes: [UBIQUINONE_POOL, AOX_BYPASS]

  - id: cytochrome_chain
    compartment: cristae
    node_width: 210
    nodes: [COMPLEX_III_BC1, CYTOCHROME_C, COMPLEX_IV_COX]

  - id: outputs_and_relief
    compartment: cristae
    node_width: 210
    nodes: [COMPLEX_V_ATPASE, PUMP_UNCOUPLING, MITO_ROS_BURST, DTC_CITRATE_CARRIER]

