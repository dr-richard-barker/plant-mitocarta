# PMM-05 — The Mitochondrial Retrograde Response (MRR) Cascade
# Protease-mediated ANAC017/013 cleavage, cytoplasmic migration, nuclear MDRE binding, and AOX1a induction.

id: PMM-05
title: The Mitochondrial Retrograde Response (MRR) Cascade
subtitle: >-
  From cristae respiratory stress to nuclear MDRE promoter activation via the
  rhomboid protease-cleaved ANAC017/013 transcription factor axis.
species_anchor: arabidopsis_thaliana
caption: >-
  Mitochondrial retrograde signaling communicates organelle dysfunction to the nuclear
  genome. Inhibition of OXPHOS or microgravity hypoxia elevates mitochondrial ROS and
  activates rhomboid-like proteases that cleave the C-terminal transmembrane domain of
  ANAC017 and ANAC013 anchored at the outer mitochondrial membrane / ER interface.
  The liberated soluble N-terminal NAC domain migrates through nuclear pores, binds the
  14-bp palindromic MDRE motif (CTTGNNNNNCAG) in the AOX1a promoter, and induces
  alternative oxidase and mitochondrial chaperones to restore bioenergetic equilibrium.

