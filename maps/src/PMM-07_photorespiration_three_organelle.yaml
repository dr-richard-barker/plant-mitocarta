# PMM-07 — The 3-Organelle Photorespiratory Metabolic Loop
# Direct metabolic highway linking Chloroplast, Peroxisome, and Mitochondria.

id: PMM-07
title: The 3-Organelle Photorespiratory Metabolic Loop
subtitle: >-
  The obligatory metabolic partnership of Chloroplasts, Peroxisomes, and Mitochondria
  recycling 2-phosphoglycolate produced by RuBisCO oxygenation.
species_anchor: arabidopsis_thaliana
caption: >-
  Photorespiration is the premier example of obligate inter-organellar metabolic coupling
  in plant biology. When RuBisCO fixes oxygen instead of CO2, toxic 2-phosphoglycolate
  is produced in chloroplasts. It is dephosphorylated to glycolate and exported via PLGG1
  to peroxisomes, where glycolate oxidase (GOX) oxidizes it to glyoxylate (generating H2O2
  scavenged by CAT2) and glutamate:glyoxylate aminotransferase (GGT) transaminates it to glycine.
  Glycine enters the mitochondrial matrix, where the massive Glycine Decarboxylase (GDC)
  complex and SHMT1 convert two molecules of glycine into serine, releasing CO2, NH3, and NADH.
  Serine returns to the peroxisome, is transaminated to hydroxypyruvate, reduced to glycerate
  by HPR, and returned via DiT1/PLGG1 to the chloroplast to re-enter the Calvin cycle as 3-PGA.

