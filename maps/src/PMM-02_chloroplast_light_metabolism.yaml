# PMM-02 — Chloroplast Light Reactions, Carbon Fixation, and Plastid Retrograde Origins
# Photosystems I/II, Cytochrome b6f, Calvin-Benson cycle (RuBisCO), and retrograde origins.

id: PMM-02
title: Chloroplast Light Reactions, Carbon Fixation, and Retrograde Origins
subtitle: >-
  Thylakoid electron transport coupled to RuBisCO carbon/oxygen fixation and
  the initiation of plastid retrograde messengers.
species_anchor: arabidopsis_thaliana
caption: >-
  The photosynthetic machinery drawn to emphasize metabolic connections and retrograde
  stress signaling. Light absorption by PSII and PSI drives the linear electron flow
  producing NADPH and ATP for the Calvin-Benson cycle. Excess light or translational stress
  generates singlet oxygen at PSII and redox stress in the stroma, inactivating SAL1
  phosphatase and triggering the accumulation of 3'-phosphoadenosine 5'-phosphate (PAP)
  and 2-C-methyl-D-erythritol 2,4-cyclodiphosphate (MEcPP). RuBisCO oxygenation initiates
  the photorespiratory cycle.

lanes:
  - id: photon_inputs
    compartment: thylakoid_lumen
    node_width: 170
    nodes: [PHOTONS_H2O, LUMEN_PROTONS]

  - id: thylakoid_chain
    compartment: thylakoid_membrane
    node_width: 210
    nodes: [PSII_OEC, CYT_B6F, PSI_COMPLEX, THYL_ATP_SYNTHASE, EX1_SENSOR]

  - id: stromal_redox
    compartment: chloroplast_stroma
    node_width: 200
    nodes: [PLASTID_NADPH, PLASTID_ATP, STROMAL_ROS]

  - id: calvin_cycle
    compartment: chloroplast_stroma
    node_width: 220
    nodes: [RUBISCO_ENZYME, CALVIN_BENSON_FLUX, TPT_TRANSLOCATOR]

  - id: retrograde_origins
    compartment: chloroplast_inner_envelope
    node_width: 210
    nodes: [SAL1_NUCLEOTIDASE, PAP_METABOLITE, PAPST1_CHANNEL, GUN1_INTEGRATOR, MECPP_INTERMEDIATE]

