# PMM-08 — Organelle Membrane Contact Sites (MCS) and Stromule-Nuclear Docking
# Physical membrane junctions: MEAMs (Mito-ER), TGD (Chloro-ER), and Stromule nuclear docking.

id: PMM-08
title: Organelle Membrane Contact Sites (MCS) and Stromule-Nuclear Docking
subtitle: >-
  Non-vesicular lipid and ion exchange across physical organellar contact sites,
  and dynamic chloroplast stromule docking directly onto the nuclear envelope.
species_anchor: arabidopsis_thaliana
caption: >-
  Subcellular organelles do not float freely; they are dynamically interconnected
  by physical membrane contact sites (MCS). Chloroplasts extend stroma-filled tubules
  (stromules) along microfilaments that physically dock to the nuclear envelope,
  channelling high concentrations of H2O2 directly into the nucleoplasm during stress
  and plant immune defense. Mitochondria-ER Associated Membranes (MEAMs) mediate
  phospholipid transfer and localized calcium microdomains, while chloroplast-ER junctions
  (TGD complexes) facilitate galactolipid and sulfolipid biogenesis.

lanes:
  - id: chloroplast_stromule_root
    compartment: chloroplast_outer_envelope
    node_width: 200
    nodes: [STROMA_H2O2_CORE, STROMULE_ELONGATION_ACTIN]

  - id: stromule_bridge
    compartment: stromule
    node_width: 210
    nodes: [STROMULE_CHANNEL, DIRECT_H2O2_CONDUIT]

  - id: nuclear_envelope_dock
    compartment: nuclear_outer_membrane
    node_width: 210
    nodes: [NUCLEAR_ENVELOPE_RECEPTOR, LOCALIZED_NUCLEOPLASM_H2O2]

  - id: er_mitochondria_meams
    compartment: mitochondria_er_contact_site_MEAM
    node_width: 220
    nodes: [VAP27_TETHER_COMPLEX, MEAM_LIPID_TRANSFER, MEAM_CALCIUM_FLUX]

  - id: mitochondrial_receptors
    compartment: mitochondrial_outer_membrane
    node_width: 210
    nodes: [OMM_VDAC_JUNCTION, MITO_LOCALIZED_CA_MICRODOMAIN]

