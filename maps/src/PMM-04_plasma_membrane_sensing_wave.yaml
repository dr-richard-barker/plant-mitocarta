# PMM-04 — Plasma Membrane Perception, Gravity Sensing, and Systemic Waves
# Mechanosensing (WAK/FER/MSL), calcium influx (GLR), ROS wave generation (RBOHD), and H2O2 channeling (PIP2;1).

id: PMM-04
title: Plasma Membrane Perception, Gravity Sensing, and Systemic Waves
subtitle: >-
  Cell surface mechanical and gravity sensing driving calcium spikes and apoplastic
  ROS waves that propagate inward to mitochondria and chloroplasts.
species_anchor: arabidopsis_thaliana
caption: >-
  The plasma membrane serves as the sensory boundary of the plant cell. Mechanical forces,
  cell wall strain, or microgravity alterations trigger wall-associated kinases (WAK1)
  and FERONIA, while membrane stretch gates MSL10 and GLR3.3/3.6 calcium channels.
  Cytosolic calcium spikes activate RBOHD NADPH oxidases to generate an extracellular
  superoxide burst, which dismutates to H2O2 and re-enters through PIP2;1 aquaporins,
  initiating organellar redox remodeling.

lanes:
  - id: apoplast_stimuli
    compartment: apoplast
    node_width: 190
    nodes: [WALL_STRAIN, APOPLASTIC_PECTIN, EXTRACELLULAR_O2]

  - id: membrane_receptors
    compartment: plasma_membrane
    node_width: 210
    nodes: [FERONIA_RECEPTOR, WAK1_PECTIN_KINASE, MSL10_STRETCH_GATE]

  - id: ion_and_ros_engines
    compartment: plasma_membrane
    node_width: 220
    nodes: [GLR_CALCIUM_CHANNELS, RBOHD_OXIDASE, PIP2_1_AQUAPORIN, AHA1_PROTON_PUMP]

  - id: cytosolic_wave
    compartment: cytosol
    node_width: 200
    nodes: [CYTOSOLIC_CA_SPIKE, CPK_KINASES, INWARD_H2O2_FLUX]

  - id: organelle_targets
    compartment: cytosol
    node_width: 210
    nodes: [MITO_PERCEPTION, CHLORO_PERCEPTION]

