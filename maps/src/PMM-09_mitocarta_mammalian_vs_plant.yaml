# PMM-09 — Cross-Kingdom Synteny: Broad MitoCarta 3.0 vs Plant Mitochondrial Proteome
# Comparing the 149 human MitoPathways with Arabidopsis mitochondrial machinery.

id: PMM-09
title: "Cross-Kingdom Synteny: Broad MitoCarta 3.0 vs Plant Mitochondrial Proteome"
subtitle: >-
  Systematic alignment of conserved catalytic bioenergetics with plant-specific
  metabolic innovations, bypasses, and dual-targeted endosymbiotic machinery.
species_anchor: arabidopsis_thaliana
caption: >-
  Comparison of the 1,136 human genes and 149 MitoPathways from Broad MitoCarta 3.0
  with the plant mitochondrial proteome. Core bioenergetics (catalytic subunits of
  Complexes I–V, TCA cycle, Fe-S ISC assembly) exhibit near-perfect 1:1 orthology.
  In contrast, plants evolved vital metabolic innovations: cyanide-resistant AOX,
  rotenone-insensitive internal/external NDHs, a matrix-facing Carbonic Anhydrase domain
  on Complex I, and the massive photorespiratory GDC complex. Additionally, key organellar
  machinery (DNA polymerase PolIA/B, aminoacyl-tRNA synthetases) evolved dual targeting
  to simultaneously coordinate mitochondria and chloroplasts.

lanes:
  - id: mammalian_mitocarta_core
    compartment: cristae
    node_width: 220
    nodes: [HUMAN_OXPHOS_CORE, HUMAN_TCA_CYCLE, HUMAN_POLG_REPLICATION]

  - id: strict_plant_orthologs
    compartment: cristae
    node_width: 220
    nodes: [PLANT_CONSERVED_OXPHOS, PLANT_CONSERVED_TCA, PLANT_FE_S_ISC_CORE]

  - id: plant_specific_innovations
    compartment: mitochondrial_inner_membrane
    node_width: 230
    nodes: [PLANT_AOX_INNOVATION, PLANT_NDH_BYPASSES, PLANT_CA_DOMAIN_COMPLEX_I, PLANT_GDC_PHOTORESP]

  - id: dual_targeted_divergence
    compartment: mitochondrial_matrix
    node_width: 220
    nodes: [DUAL_TARGETED_POLIA_B, DUAL_TARGETED_AARS, EXPANDED_PPR_FAMILY]

  - id: translational_inference
    compartment: mitochondrial_matrix
    node_width: 220
    nodes: [HUMAN_DISEASE_INSIGHTS, AOX_HUMAN_RESCUE_POTENTIAL]

