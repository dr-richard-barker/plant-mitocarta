<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1370.2 650.0" width="1370.2" height="650.0" class="pmc-svg" data-theme="dark">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1370.2" height="650.0" />
<text class="pmc-title" x="32" y="44">Organelle Membrane Contact Sites (MCS) and Stromule-Nuclear Docking</text>
<text class="pmc-subtitle" x="32" y="66">Non-vesicular lipid and ion exchange across physical organellar contact sites, and dynamic chloroplast stromule docking directly onto the nuclear envelope.</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="275.4" height="196.2" stroke="#666666" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Chloroplast Outer Envelope (OEM)</text>
<rect class="pmc-compartment" x="279.4" y="90.0" width="240.6" height="221.2" stroke="#0d684f" />
<text class="pmc-compartment-label" x="291.4" y="108.0">Stromule (Stroma-filled tubule)</text>
<rect class="pmc-compartment" x="525.4" y="90.0" width="293.2" height="224.4" stroke="#666666" />
<text class="pmc-compartment-label" x="537.4" y="108.0">Nuclear Outer Membrane</text>
<rect class="pmc-compartment" x="798.6" y="90.0" width="285.5" height="276.4" stroke="#855c1b" />
<text class="pmc-compartment-label" x="810.6" y="108.0">Mitochondria-ER Associated Membrane (MEAM)</text>
<rect class="pmc-compartment" x="1064.2" y="90.0" width="258.0" height="224.4" stroke="#666666" />
<text class="pmc-compartment-label" x="1076.2" y="108.0">Mitochondrial Outer Membrane (OMM)</text>
<line class="pmc-edge pmc-edge-activates" x1="161.7" y1="178.1" x2="158.8" y2="210.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="160.2" y="190.1">stress induces elongation</text>
<line class="pmc-edge pmc-edge-activates" x1="265.6" y1="234.2" x2="307.4" y2="160.3" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="286.5" y="193.2">extends along actin</text>
<line class="pmc-edge pmc-edge-activates" x1="399.7" y1="190.6" x2="399.7" y2="222.6" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="399.7" y="202.6">channels stromal contents</text>
<line class="pmc-edge pmc-edge-activates" x1="492.0" y1="252.9" x2="553.4" y2="161.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="522.7" y="203.4">physical membrane docking</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="660.4" y1="193.8" x2="672.0" y2="225.8" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="666.2" y="205.8">direct H2O2 delivery into nucleus</text>
<line class="pmc-edge pmc-edge-activates" x1="941.4" y1="178.1" x2="941.4" y2="210.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="941.4" y="190.1">holds ER and OMM in 15-30 nm proximity</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="1056.2" y1="234.2" x2="1092.2" y2="154.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="1074.2" y="190.1">lipid exchange</text>
<line class="pmc-edge pmc-edge-activates" x1="941.4" y1="178.1" x2="925.9" y2="290.2" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="933.6" y="230.2">calcium microdomain</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="1025.2" y1="314.3" x2="1092.2" y2="154.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="1058.7" y="230.2">Ca2+ flux through VDAC</text>
<line class="pmc-edge pmc-edge-activates" x1="1183.7" y1="178.1" x2="1193.2" y2="210.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1188.4" y="190.1">matrix Ca2+ uptake</text>
<g class="pmc-node-group" id="node-STROMA_H2O2_CORE"><rect class="pmc-node tier-T4" x="52.0" y="130.0" width="219.4" height="48.1" />
<text class="pmc-label" x="161.7" y="148.1">Stromal H2O2 Generation</text>
<text class="pmc-sub" x="161.7" y="163.1">excess excitation • thylakoid ROS</text>
</g>
<g class="pmc-node-group" id="node-STROMULE_ELONGATION_ACTIN"><rect class="pmc-node tier-T4" x="52.0" y="210.1" width="213.6" height="48.1" />
<text class="pmc-label" x="158.8" y="228.2">Stromule Induction</text>
<text class="pmc-sub" x="158.8" y="243.2">myosin XI • actin microfilaments</text>
</g>
<g class="pmc-node-group" id="node-STROMULE_CHANNEL"><rect class="pmc-node tier-T1" x="307.4" y="130.0" width="184.6" height="60.6" />
<text class="pmc-label" x="399.7" y="148.3">Stromule Extension</text>
<text class="pmc-sub" x="399.7" y="163.3">tubular plastid extension •</text>
<text class="pmc-sub" x="399.7" y="175.3">stroma-filled</text>
</g>
<g class="pmc-node-group" id="node-DIRECT_H2O2_CONDUIT"><rect class="pmc-node tier-T4" x="307.4" y="222.6" width="184.6" height="60.6" />
<text class="pmc-label" x="399.7" y="240.9">Privileged H2O2 Flux</text>
<text class="pmc-sub" x="399.7" y="255.9">avoids cytosolic dilution •</text>
<text class="pmc-sub" x="399.7" y="267.9">concentrated signal</text>
</g>
<g class="pmc-node-group" id="node-NUCLEAR_ENVELOPE_RECEPTOR"><rect class="pmc-node tier-T4" x="553.4" y="130.0" width="214.0" height="63.8" />
<text class="pmc-label" x="660.4" y="148.4">Nuclear Envelope Contact</text>
<text class="pmc-label" x="660.4" y="163.4">Zone</text>
<text class="pmc-sub" x="660.4" y="178.4">perinuclear docking site</text>
</g>
<g class="pmc-node-group" id="node-LOCALIZED_NUCLEOPLASM_H2O2"><rect class="pmc-node tier-T4" x="553.4" y="225.8" width="237.2" height="60.6" />
<text class="pmc-label" x="672.0" y="244.1">Nuclear Redox Reprogramming</text>
<text class="pmc-sub" x="672.0" y="259.1">oxidizes nuclear TFs • activates</text>
<text class="pmc-sub" x="672.0" y="271.1">defense</text>
</g>
<g class="pmc-node-group" id="node-VAP27_TETHER_COMPLEX"><rect class="pmc-node tier-T4" x="826.6" y="130.0" width="229.5" height="48.1" />
<text class="pmc-label" x="941.4" y="148.1">VAP27-anchored MCS Tethers</text>
<text class="pmc-sub" x="941.4" y="163.1">membrane tethering complex</text>
</g>
<g class="pmc-node-group" id="node-MEAM_LIPID_TRANSFER"><rect class="pmc-node tier-T1" x="826.6" y="210.1" width="229.5" height="48.1" />
<text class="pmc-label" x="941.4" y="228.2">MEAM Phospholipid Transfer</text>
<text class="pmc-sub" x="941.4" y="243.2">phosphatidylserine / cardiolipin</text>
</g>
<g class="pmc-node-group" id="node-MEAM_CALCIUM_FLUX"><rect class="pmc-node tier-T4" x="826.6" y="290.2" width="198.5" height="48.1" />
<text class="pmc-label" x="925.9" y="308.3">MEAM Calcium Tunneling</text>
<text class="pmc-sub" x="925.9" y="323.3">ER Ca2+ release -&gt; OMM</text>
</g>
<g class="pmc-node-group" id="node-OMM_VDAC_JUNCTION"><rect class="pmc-node tier-T4" x="1092.2" y="130.0" width="183.0" height="48.1" />
<text class="pmc-label" x="1183.7" y="148.1">OMM VDAC1-3 Channels</text>
<text class="pmc-sub" x="1183.7" y="163.1">outer membrane pore</text>
</g>
<g class="pmc-node-group" id="node-MITO_LOCALIZED_CA_MICRODOMAIN"><rect class="pmc-node tier-T4" x="1092.2" y="210.1" width="202.0" height="76.2" />
<text class="pmc-label" x="1193.2" y="228.8">Mitochondrial Ca2+</text>
<text class="pmc-label" x="1193.2" y="243.8">Microdomain</text>
<text class="pmc-sub" x="1193.2" y="258.8">MCU uptake • stimulates matrix</text>
<text class="pmc-sub" x="1193.2" y="270.8">dehydrogenases</text>
</g>
</svg>