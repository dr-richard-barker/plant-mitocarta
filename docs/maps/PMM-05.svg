<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1379.7 650.0" width="1379.7" height="650.0" class="pmc-svg" data-theme="light">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1379.7" height="650.0" />
<text class="pmc-title" x="32" y="44">The Mitochondrial Retrograde Response (MRR) Cascade</text>
<text class="pmc-subtitle" x="32" y="66">From cristae respiratory stress to nuclear MDRE promoter activation via the rhomboid protease-cleaved ANAC017/013 transcription factor axis.</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="270.0" height="236.9" stroke="#6b3f0d" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Mitochondrial Cristae</text>
<rect class="pmc-compartment" x="274.0" y="90.0" width="292.8" height="288.9" stroke="#666666" />
<text class="pmc-compartment-label" x="286.0" y="108.0">Mitochondrial Outer Membrane (OMM)</text>
<rect class="pmc-compartment" x="546.8" y="90.0" width="269.6" height="320.1" stroke="#264b63" />
<text class="pmc-compartment-label" x="558.8" y="108.0">Cytosol</text>
<rect class="pmc-compartment" x="796.4" y="90.0" width="270.0" height="196.2" stroke="#666666" />
<text class="pmc-compartment-label" x="808.4" y="108.0">Nuclear Pore Complex</text>
<rect class="pmc-compartment" x="1046.4" y="90.0" width="293.2" height="304.5" stroke="#3b2044" />
<text class="pmc-compartment-label" x="1058.4" y="108.0">Nucleoplasm</text>
<line class="pmc-edge pmc-edge-activates" x1="139.6" y1="206.2" x2="159.0" y2="238.2" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="149.3" y="218.2">generates superoxide</text>
<line class="pmc-edge pmc-edge-activates" x1="266.0" y1="268.6" x2="302.0" y2="160.3" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="284.0" y="210.4">oxidative activation</text>
<line class="pmc-edge pmc-edge-cleaved_by" x1="405.9" y1="190.6" x2="420.4" y2="222.6" marker-end="url(#pmc-arrow)" />
<text class="pmc-edge-label" x="413.1" y="202.6">intramembrane cleavage</text>
<line class="pmc-edge pmc-edge-cleaved_by" x1="405.9" y1="190.6" x2="403.0" y2="302.8" marker-end="url(#pmc-arrow)" />
<text class="pmc-edge-label" x="404.4" y="242.7">intramembrane cleavage</text>
<line class="pmc-edge pmc-edge-activates" x1="538.8" y1="246.7" x2="574.8" y2="161.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="556.8" y="200.3">releases into cytosol</text>
<line class="pmc-edge pmc-edge-activates" x1="504.0" y1="326.8" x2="574.8" y2="257.6" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="539.4" y="288.2">releases into cytosol</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="227.2" y1="168.1" x2="574.8" y2="351.8" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="401.0" y="256.0">TCA backlog</text>
<line class="pmc-edge pmc-edge-activates" x1="788.4" y1="161.9" x2="824.4" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="806.4" y="154.0">interacts with NPCs</text>
<line class="pmc-edge pmc-edge-activates" x1="757.8" y1="257.6" x2="824.4" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="791.1" y="201.8">interacts with NPCs</text>
<line class="pmc-edge pmc-edge-activates" x1="1007.4" y1="154.1" x2="1074.4" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1040.9" y="150.1">nuclear entry &amp; MDRE binding</text>
<line class="pmc-edge pmc-edge-activates" x1="765.5" y1="351.8" x2="1074.4" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="920.0" y="248.9">epigenetic chromatin opening</text>
<line class="pmc-edge pmc-edge-activates" x1="1185.3" y1="178.1" x2="1193.0" y2="210.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1189.2" y="190.1">high-level transcription</text>
<line class="pmc-edge pmc-edge-activates" x1="1185.3" y1="178.1" x2="1189.9" y2="302.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1187.6" y="236.4">MSR induction</text>
<g class="pmc-node-group" id="node-OXPHOS_LESION"><rect class="pmc-node tier-T4" x="52.0" y="130.0" width="175.2" height="76.2" />
<text class="pmc-label" x="139.6" y="148.6">OXPHOS Inhibition /</text>
<text class="pmc-label" x="139.6" y="163.6">Hypoxia</text>
<text class="pmc-sub" x="139.6" y="178.6">antimycin A • rotenone •</text>
<text class="pmc-sub" x="139.6" y="190.6">spaceflight hypoxia</text>
</g>
<g class="pmc-node-group" id="node-MITO_SUPEROXIDE_ACCUMULATION"><rect class="pmc-node tier-T1" x="52.0" y="238.2" width="214.0" height="60.6" />
<text class="pmc-label" x="159.0" y="256.6">Mitochondrial ROS (H2O2)</text>
<text class="pmc-sub" x="159.0" y="271.6">membrane permeant • primary</text>
<text class="pmc-sub" x="159.0" y="283.6">trigger</text>
</g>
<g class="pmc-node-group" id="node-RHOMBOID_PROTEASE_ACT"><rect class="pmc-node tier-T4" x="302.0" y="130.0" width="207.8" height="60.6" />
<text class="pmc-label" x="405.9" y="148.3">Rhomboid-Like Proteases</text>
<text class="pmc-sub" x="405.9" y="163.3">intramembrane serine protease •</text>
<text class="pmc-sub" x="405.9" y="175.3">ROS-activated</text>
</g>
<g class="pmc-node-group" id="node-ANAC017_TETHERED"><rect class="pmc-node tier-T1" x="302.0" y="222.6" width="236.8" height="48.1" />
<text class="pmc-label" x="420.4" y="240.7">Membrane-Bound ANAC017</text>
<text class="pmc-sub" x="420.4" y="255.7">ER/OMM anchored • inactive precursor</text>
</g>
<g class="pmc-node-group" id="node-ANAC013_TETHERED"><rect class="pmc-node tier-T1" x="302.0" y="302.8" width="202.0" height="48.1" />
<text class="pmc-label" x="403.0" y="320.8">Membrane-Bound ANAC013</text>
<text class="pmc-sub" x="403.0" y="335.8">ER/OMM anchored • co-regulator</text>
</g>
<g class="pmc-node-group" id="node-ANAC017_SOLUBLE_NAC"><rect class="pmc-node tier-T4" x="574.8" y="130.0" width="213.6" height="63.8" />
<text class="pmc-label" x="681.6" y="148.4">Soluble ANAC017 (NAC</text>
<text class="pmc-label" x="681.6" y="163.4">Domain)</text>
<text class="pmc-sub" x="681.6" y="178.4">cleaved N-fragment • carries NLS</text>
</g>
<g class="pmc-node-group" id="node-ANAC013_SOLUBLE_NAC"><rect class="pmc-node tier-T4" x="574.8" y="225.8" width="183.0" height="63.8" />
<text class="pmc-label" x="666.3" y="244.1">Soluble ANAC013 (NAC</text>
<text class="pmc-label" x="666.3" y="259.1">Domain)</text>
<text class="pmc-sub" x="666.3" y="274.1">cleaved N-fragment</text>
</g>
<g class="pmc-node-group" id="node-CITRATE_2OG_EXPORT"><rect class="pmc-node tier-T1" x="574.8" y="321.5" width="190.8" height="60.6" />
<text class="pmc-label" x="670.2" y="339.8">Citrate / 2-OG Efflux</text>
<text class="pmc-sub" x="670.2" y="354.8">DTC translocator • metabolic</text>
<text class="pmc-sub" x="670.2" y="366.8">signal</text>
</g>
<g class="pmc-node-group" id="node-NPC_TRANSLOCATION_GATE"><rect class="pmc-node tier-T1" x="824.4" y="130.0" width="183.0" height="48.1" />
<text class="pmc-label" x="915.9" y="148.1">Nuclear Pore Complex</text>
<text class="pmc-sub" x="915.9" y="163.1">regulates import</text>
</g>
<g class="pmc-node-group" id="node-KARYOPHERIN_IMPORT"><rect class="pmc-node tier-T4" x="824.4" y="210.1" width="214.0" height="48.1" />
<text class="pmc-label" x="931.4" y="228.2">Importin-α / β Machinery</text>
<text class="pmc-sub" x="931.4" y="243.2">facilitated transport</text>
</g>
<g class="pmc-node-group" id="node-MDRE_BINDING_SITE"><rect class="pmc-node tier-T1" x="1074.4" y="130.0" width="221.8" height="48.1" />
<text class="pmc-label" x="1185.3" y="148.1">MDRE Promoter Cis-Element</text>
<text class="pmc-sub" x="1185.3" y="163.1">CTTGNNNNNCAG • AOX1a promoter</text>
</g>
<g class="pmc-node-group" id="node-AOX1A_INDUCTION"><rect class="pmc-node tier-T1" x="1074.4" y="210.1" width="237.2" height="60.6" />
<text class="pmc-label" x="1193.0" y="228.4">AOX1a Transcriptional Surge</text>
<text class="pmc-sub" x="1193.0" y="243.4">alternative respiration • restores</text>
<text class="pmc-sub" x="1193.0" y="255.4">electron flow</text>
</g>
<g class="pmc-node-group" id="node-UPM1_HSP70_INDUCTION"><rect class="pmc-node tier-T4" x="1074.4" y="302.8" width="231.0" height="63.8" />
<text class="pmc-label" x="1189.9" y="321.1">Mitochondrial Chaperones</text>
<text class="pmc-label" x="1189.9" y="336.1">(UPM1)</text>
<text class="pmc-sub" x="1189.9" y="351.1">mitochondrial stress response (MSR)</text>
</g>
</svg>