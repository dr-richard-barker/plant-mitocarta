<text class="pmc-edge-label" x="256.5" y="196.4">nuclear entry</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="235.0" y1="160.3" x2="278.0" y2="333.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="256.5" y="242.7">nuclear entry</text>
<line class="pmc-edge pmc-edge-activates" x1="491.6" y1="154.1" x2="810.5" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="651.0" y="150.1">binds MDRE palindromic motif</text>
<line class="pmc-edge pmc-edge-activates" x1="491.6" y1="240.4" x2="810.5" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="651.0" y="193.2">binds MDRE motif</text>
<line class="pmc-edge pmc-edge-activates" x1="1041.5" y1="154.1" x2="1077.5" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1059.5" y="150.1">transcription</text>
<line class="pmc-edge pmc-edge-activates" x1="1041.5" y1="154.1" x2="1077.5" y2="234.2" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1059.5" y="190.1">transcription</text>
<line class="pmc-edge pmc-edge-inhibits" x1="509.0" y1="333.1" x2="545.0" y2="314.3" marker-end="url(#pmc-inhibit)" />
<text class="pmc-edge-label" x="527.0" y="319.7">direct enzymatic inhibition</text>
<line class="pmc-edge pmc-edge-activates" x1="774.5" y1="314.3" x2="1077.5" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="926.0" y="230.2">transcript stabilization</text>
<line class="pmc-edge pmc-edge-inhibits" x1="741.2" y1="154.1" x2="810.5" y2="240.4" marker-end="url(#pmc-inhibit)" />
<text class="pmc-edge-label" x="775.9" y="193.2">represses transcription</text>
<line class="pmc-edge pmc-edge-activates" x1="728.0" y1="234.2" x2="810.5" y2="240.4" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="769.2" y="233.3">activates transcription</text>
<line class="pmc-edge pmc-edge-activates" x1="1018.3" y1="240.4" x2="1077.5" y2="322.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1047.9" y="277.3">transcription</text>
<line class="pmc-edge pmc-edge-activates" x1="1169.0" y1="178.1" x2="1196.1" y2="386.0" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1182.6" y="278.1">energy coordination</text>
<g class="pmc-node-group" id="node-NPC_GATE"><rect class="pmc-node tier-T1" x="52.0" y="130.0" width="183.0" height="60.6" />
