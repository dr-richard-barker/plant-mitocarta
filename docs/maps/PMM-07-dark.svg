<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1397.5 650.0" width="1397.5" height="650.0" class="pmc-svg" data-theme="dark">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1397.5" height="650.0" />
<text class="pmc-title" x="32" y="44">The 3-Organelle Photorespiratory Metabolic Loop</text>
<text class="pmc-subtitle" x="32" y="66">The obligatory metabolic partnership of Chloroplasts, Peroxisomes, and Mitochondria recycling 2-phosphoglycolate produced by RuBisCO oxygenation.</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="1333.5" height="301.4" stroke="#084736" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Chloroplast Stroma</text>
<rect class="pmc-compartment" x="281.8" y="90.0" width="818.0" height="304.5" stroke="#6b5a06" />
<text class="pmc-compartment-label" x="293.8" y="108.0">Peroxisome (Photorespiratory nexus)</text>
<rect class="pmc-compartment" x="548.8" y="90.0" width="293.2" height="409.6" stroke="#5c3407" />
<text class="pmc-compartment-label" x="560.8" y="108.0">Mitochondrial Matrix</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="153.0" y1="178.1" x2="162.9" y2="210.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="157.9" y="190.1">oxygen fixation</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="162.9" y1="270.8" x2="147.2" y2="302.8" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="155.0" y="282.8">PGLP1 dephosphorylation</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="242.4" y1="333.1" x2="309.8" y2="160.3" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="276.1" y="242.7">glycolate enters peroxisome</text>
<line class="pmc-edge pmc-edge-activates" x1="425.2" y1="190.6" x2="399.1" y2="222.6" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="412.2" y="202.6">generates H2O2</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="425.2" y1="190.6" x2="412.9" y2="302.8" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="419.1" y="242.7">glyoxylate intermediate</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="516.0" y1="334.6" x2="576.8" y2="160.3" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="546.4" y="243.5">glycine enters mitochondria</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="695.4" y1="190.6" x2="666.1" y2="222.6" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="680.8" y="202.6">5,10-CH2-THF transfer</text>
<line class="pmc-edge pmc-edge-activates" x1="695.4" y1="190.6" x2="679.9" y2="302.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="687.6" y="242.7">releases NADH, CO2, NH3</text>
<line class="pmc-edge pmc-edge-activates" x1="679.9" y1="379.0" x2="689.4" y2="411.0" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="684.6" y="391.0">CO2 trapping / electron flow</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="755.5" y1="246.7" x2="850.0" y2="257.6" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="802.8" y="248.2">serine exported to peroxisome</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="937.6" y1="225.8" x2="960.9" y2="193.8" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="949.2" y="205.8">hydroxypyruvate reduction</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="1071.8" y1="161.9" x2="1107.8" y2="154.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="1089.8" y="154.0">glycerate export</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="1218.6" y1="178.1" x2="1210.9" y2="210.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="1214.8" y="190.1">stromal glycerate entry</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="1210.9" y1="258.2" x2="1205.8" y2="290.2" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="1208.4" y="270.2">3-PGA returned to Calvin cycle</text>
<g class="pmc-node-group" id="node-RUBISCO_O2_REACTION"><rect class="pmc-node tier-T1" x="52.0" y="130.0" width="202.0" height="48.1" />
<text class="pmc-label" x="153.0" y="148.1">RuBisCO Oxygenation</text>
<text class="pmc-sub" x="153.0" y="163.1">RuBP + O2 • oxygenase reaction</text>
</g>
<g class="pmc-node-group" id="node-CHLORO_2_PG_POOL"><rect class="pmc-node tier-T4" x="52.0" y="210.1" width="221.8" height="60.6" />
<text class="pmc-label" x="162.9" y="228.4">2-Phosphoglycolate (2-PG)</text>
<text class="pmc-sub" x="162.9" y="243.4">toxic intermediate •</text>
<text class="pmc-sub" x="162.9" y="255.4">dephosphorylated</text>
</g>
<g class="pmc-node-group" id="node-PLGG1_GLYCOLATE_EXPORT"><rect class="pmc-node tier-T1" x="52.0" y="302.8" width="190.4" height="60.6" />
<text class="pmc-label" x="147.2" y="321.1">PLGG1 Translocator</text>
<text class="pmc-sub" x="147.2" y="336.1">exports glycolate • envelope</text>
<text class="pmc-sub" x="147.2" y="348.1">translocator</text>
</g>
<g class="pmc-node-group" id="node-GOX_OXIDASE"><rect class="pmc-node tier-T4" x="309.8" y="130.0" width="231.0" height="60.6" />
<text class="pmc-label" x="425.2" y="148.3">Glycolate Oxidase (GOX)</text>
<text class="pmc-sub" x="425.2" y="163.3">glycolate -&gt; glyoxylate • generates</text>
<text class="pmc-sub" x="425.2" y="175.3">H2O2</text>
</g>
<g class="pmc-node-group" id="node-CATALASE_CAT2"><rect class="pmc-node tier-T4" x="309.8" y="222.6" width="178.8" height="48.1" />
<text class="pmc-label" x="399.1" y="240.7">Catalase 2 (CAT2)</text>
<text class="pmc-sub" x="399.1" y="255.7">scavenges peroxisomal H2O2</text>
</g>
<g class="pmc-node-group" id="node-GGT_AMINOTRANSFERASE"><rect class="pmc-node tier-T4" x="309.8" y="302.8" width="206.2" height="63.8" />
<text class="pmc-label" x="412.9" y="321.1">Glutamate:Glyoxylate AT</text>
<text class="pmc-label" x="412.9" y="336.1">(GGT)</text>
<text class="pmc-sub" x="412.9" y="351.1">yields glycine</text>
</g>
<g class="pmc-node-group" id="node-GDC_P_T_H_L_COMPLEX"><rect class="pmc-node tier-T1" x="576.8" y="130.0" width="237.2" height="60.6" />
<text class="pmc-label" x="695.4" y="148.3">Glycine Decarboxylase (GDC)</text>
<text class="pmc-sub" x="695.4" y="163.3">P-, T-, H-, L-proteins • matrix</text>
<text class="pmc-sub" x="695.4" y="175.3">photorespiratory engine</text>
</g>
<g class="pmc-node-group" id="node-SHMT1_SERINE_SYNTH"><rect class="pmc-node tier-T1" x="576.8" y="222.6" width="178.8" height="48.1" />
<text class="pmc-label" x="666.1" y="240.7">SHMT1</text>
<text class="pmc-sub" x="666.1" y="255.7">converts glycine -&gt; serine</text>
</g>
<g class="pmc-node-group" id="node-MATRIX_NADH_PRODUCTION"><rect class="pmc-node tier-T4" x="576.8" y="302.8" width="206.2" height="76.2" />
<text class="pmc-label" x="679.9" y="321.4">Matrix NADH &amp; CO2 / NH3</text>
<text class="pmc-label" x="679.9" y="336.4">Release</text>
<text class="pmc-sub" x="679.9" y="351.4">feeds Complex I / AOX •</text>
<text class="pmc-sub" x="679.9" y="363.4">photorespiratory nitrogen</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_I_CA_INTERACTION"><rect class="pmc-node tier-T1" x="576.8" y="411.0" width="225.2" height="60.6" />
<text class="pmc-label" x="689.4" y="429.3">Complex I CA Domain Nexus</text>
<text class="pmc-sub" x="689.4" y="444.3">carbonic anhydrase domain •</text>
<text class="pmc-sub" x="689.4" y="456.3">re-circulates photorespiratory CO2</text>
</g>
<g class="pmc-node-group" id="node-HPR_GLYCERATE_REDUCTASE"><rect class="pmc-node tier-T4" x="850.0" y="130.0" width="221.8" height="63.8" />
<text class="pmc-label" x="960.9" y="148.4">Hydroxypyruvate Reductase</text>
<text class="pmc-label" x="960.9" y="163.4">(HPR)</text>
<text class="pmc-sub" x="960.9" y="178.4">yields glycerate • consumes NADH</text>
</g>
<g class="pmc-node-group" id="node-PEROXISOMAL_SERINE_POOL"><rect class="pmc-node tier-T4" x="850.0" y="225.8" width="175.2" height="63.8" />
<text class="pmc-label" x="937.6" y="244.1">Serine Transport to</text>
<text class="pmc-label" x="937.6" y="259.1">Peroxisome</text>
<text class="pmc-sub" x="937.6" y="274.1">serine:glyoxylate AT</text>
</g>
<g class="pmc-node-group" id="node-DIT1_GLYCERATE_IMPORT"><rect class="pmc-node tier-T1" x="1107.8" y="130.0" width="221.8" height="48.1" />
<text class="pmc-label" x="1218.6" y="148.1">DiT1 / PLGG1 Translocator</text>
<text class="pmc-sub" x="1218.6" y="163.1">imports glycerate into stroma</text>
</g>
<g class="pmc-node-group" id="node-GLYCERATE_KINASE_GLYK"><rect class="pmc-node tier-T4" x="1107.8" y="210.1" width="206.2" height="48.1" />
<text class="pmc-label" x="1210.9" y="228.2">Glycerate Kinase (GLYK)</text>
<text class="pmc-sub" x="1210.9" y="243.2">glycerate + ATP -&gt; 3-PGA</text>
</g>
<g class="pmc-node-group" id="node-THREE_PGA_CALVIN_RETURN"><rect class="pmc-node tier-T4" x="1107.8" y="290.2" width="196.2" height="63.8" />
<text class="pmc-label" x="1205.8" y="308.6">3-Phosphoglycerate</text>
<text class="pmc-label" x="1205.8" y="323.6">(3-PGA)</text>
<text class="pmc-sub" x="1205.8" y="338.6">re-enters Calvin-Benson cycle</text>
</g>
</svg>