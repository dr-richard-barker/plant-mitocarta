<text class="pmc-label" x="141.4" y="148.6">Mechanical /</text>
<text class="pmc-label" x="141.4" y="163.6">Microgravity Strain</text>
<text class="pmc-sub" x="141.4" y="178.6">wall deformation • gravity</text>
<text class="pmc-sub" x="141.4" y="190.6">vector shift</text>
</g>
