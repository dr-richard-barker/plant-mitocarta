<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1390.4 650.0" width="1390.4" height="650.0" class="pmc-svg" data-theme="dark">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1390.4" height="650.0" />
<text class="pmc-title" x="32" y="44">Plasma Membrane Perception, Gravity Sensing, and Systemic Waves</text>
<text class="pmc-subtitle" x="32" y="66">Cell surface mechanical and gravity sensing driving calcium spikes and apoplastic ROS waves that propagate inward to mitochondria and chloroplasts.</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="270.0" height="304.5" stroke="#3d3d3d" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Apoplast &amp; Cell Wall</text>
<rect class="pmc-compartment" x="274.0" y="90.0" width="548.2" height="381.5" stroke="#1d4e6b" />
<text class="pmc-compartment-label" x="286.0" y="108.0">Plasma Membrane</text>
<rect class="pmc-compartment" x="802.2" y="90.0" width="548.2" height="276.4" stroke="#264b63" />
<text class="pmc-compartment-label" x="814.2" y="108.0">Cytosol</text>
<line class="pmc-edge pmc-edge-activates" x1="230.8" y1="168.1" x2="302.0" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="266.4" y="157.1">mechanical stretch</text>
<line class="pmc-edge pmc-edge-activates" x1="266.0" y1="262.3" x2="302.0" y2="234.2" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="284.0" y="244.2">oligogalacturonide binding</text>
<line class="pmc-edge pmc-edge-activates" x1="230.8" y1="168.1" x2="302.0" y2="322.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="266.4" y="241.1">membrane tension</text>
<line class="pmc-edge pmc-edge-activates" x1="509.8" y1="154.1" x2="557.4" y2="160.3" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="533.6" y="153.2">triggers Ca2+ gating</text>
<line class="pmc-edge pmc-edge-activates" x1="521.4" y1="322.1" x2="830.2" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="675.8" y="234.1">cation influx</text>
<line class="pmc-edge pmc-edge-activates" x1="794.2" y1="160.3" x2="830.2" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="812.2" y="153.2">rapid Ca2+ influx</text>
<line class="pmc-edge pmc-edge-activates" x1="925.6" y1="178.1" x2="939.9" y2="210.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="932.7" y="190.1">Ca2+ binding to EF-hands</text>
<line class="pmc-edge pmc-edge-activates" x1="830.2" y1="234.2" x2="776.8" y2="252.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="803.5" y="239.6">Ser-343/347 phosphorylation</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="250.5" y1="342.4" x2="557.4" y2="252.9" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="403.9" y="293.7">generates O2•-</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="667.1" y1="283.2" x2="658.4" y2="315.2" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="662.8" y="295.2">O2•- -&gt; H2O2 diffusion</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="759.4" y1="339.3" x2="830.2" y2="314.3" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="794.8" y="322.8">channels H2O2 into cytosol</text>
<line class="pmc-edge pmc-edge-activates" x1="1020.9" y1="154.1" x2="1085.6" y2="161.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1053.3" y="154.0">MCU channel uptake</text>
<line class="pmc-edge pmc-edge-activates" x1="1005.4" y1="314.3" x2="1085.6" y2="161.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1045.5" y="234.1">activates rhomboid/AOX1a</text>
<line class="pmc-edge pmc-edge-activates" x1="1020.9" y1="154.1" x2="1085.6" y2="249.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1053.3" y="197.9">stromal Ca2+ signaling</text>
<line class="pmc-edge pmc-edge-activates" x1="1005.4" y1="314.3" x2="1085.6" y2="249.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1045.5" y="278.1">oxidizes SAL1</text>
