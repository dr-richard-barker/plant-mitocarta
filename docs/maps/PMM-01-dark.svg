<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1351.9 650.0" width="1351.9" height="650.0" class="pmc-svg" data-theme="dark">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1351.9" height="650.0" />
<text class="pmc-title" x="32" y="44">Plant Mitochondrial Electron Transport and Oxidative Phosphorylation</text>
<text class="pmc-subtitle" x="32" y="66">Conserved respiratory Complexes I–V integrated with plant-specific bypasses (AOX, Type II NDHs, and the Complex I Carbonic Anhydrase domain).</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="246.8" height="276.4" stroke="#5c3407" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Mitochondrial Matrix</text>
<rect class="pmc-compartment" x="250.8" y="90.0" width="542.4" height="474.1" stroke="#8c5618" />
<text class="pmc-compartment-label" x="262.8" y="108.0">Mitochondrial Inner Membrane (IMM)</text>
<rect class="pmc-compartment" x="773.1" y="90.0" width="536.6" height="397.1" stroke="#6b3f0d" />
<text class="pmc-compartment-label" x="785.1" y="108.0">Mitochondrial Cristae</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="204.0" y1="154.1" x2="278.8" y2="160.3" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="241.4" y="153.2">2e−</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="128.0" y1="178.1" x2="385.6" y2="395.4" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="256.8" y="282.8">bypass</text>
<line class="pmc-edge pmc-edge-activates" x1="393.5" y1="190.6" x2="391.4" y2="222.6" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="392.4" y="202.6">structural assembly</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="207.6" y1="234.2" x2="278.8" y2="339.3" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="243.2" y="282.8">2e−</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="508.2" y1="160.3" x2="551.5" y2="154.1" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="529.9" y="153.2">QH2</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="440.1" y1="339.3" x2="551.5" y2="154.1" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="495.8" y="242.7">QH2</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="385.6" y1="395.4" x2="654.7" y2="178.1" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="520.1" y="282.8">QH2</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="397.1" y1="488.0" x2="654.7" y2="178.1" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="525.9" y="329.1">QH2</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="654.7" y1="178.1" x2="658.3" y2="210.1" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="656.5" y="190.1">relief valve</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="551.5" y1="248.2" x2="242.8" y2="314.3" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="397.1" y="277.3">4e− -&gt; 2 H2O</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="757.8" y1="154.1" x2="801.1" y2="160.3" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="779.5" y="153.2">Q cycle</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="919.5" y1="190.6" x2="867.3" y2="222.6" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="893.4" y="202.6">1e−</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="867.3" y1="270.8" x2="902.1" y2="302.8" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="884.8" y="282.8">1e−</text>
<line class="pmc-edge pmc-edge-electron_transfer" x1="801.1" y1="326.8" x2="242.8" y2="314.3" marker-end="url(#pmc-arrow-blue)" />
<text class="pmc-edge-label" x="522.0" y="316.6">4e− -&gt; 2 H2O</text>
<line class="pmc-edge pmc-edge-activates" x1="508.2" y1="160.3" x2="1073.9" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="791.1" y="153.2">H+ gradient</text>
<line class="pmc-edge pmc-edge-activates" x1="1038.0" y1="160.3" x2="1073.9" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1055.9" y="153.2">H+ gradient</text>
<line class="pmc-edge pmc-edge-activates" x1="1003.1" y1="326.8" x2="1073.9" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1038.5" y="236.4">H+ gradient</text>
<line class="pmc-edge pmc-edge-inhibits" x1="1161.6" y1="178.1" x2="1177.8" y2="210.1" marker-end="url(#pmc-inhibit)" />
<text class="pmc-edge-label" x="1169.7" y="190.1">proton uncoupling</text>
<line class="pmc-edge pmc-edge-activates" x1="508.2" y1="160.3" x2="1073.9" y2="328.4" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="791.1" y="240.3">electron leak</text>
<line class="pmc-edge pmc-edge-activates" x1="1038.0" y1="160.3" x2="1073.9" y2="328.4" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1055.9" y="240.3">electron leak</text>
<line class="pmc-edge pmc-edge-activates" x1="1172.0" y1="366.5" x2="1169.1" y2="398.5" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1170.6" y="378.5">stress signaling</text>
<g class="pmc-node-group" id="node-MATRIX_NADH"><rect class="pmc-node tier-T4" x="52.0" y="130.0" width="152.0" height="48.1" />
<text class="pmc-label" x="128.0" y="148.1">Matrix NADH Pool</text>
<text class="pmc-sub" x="128.0" y="163.1">matrix redox couple</text>
</g>
<g class="pmc-node-group" id="node-SUCCINATE_POOL"><rect class="pmc-node tier-T4" x="52.0" y="210.1" width="155.6" height="48.1" />
<text class="pmc-label" x="129.8" y="228.2">Succinate Pool</text>
<text class="pmc-sub" x="129.8" y="243.2">TCA cycle intermediate</text>
</g>
<g class="pmc-node-group" id="node-O2_SUBSTRATE"><rect class="pmc-node tier-T4" x="52.0" y="290.2" width="190.8" height="48.1" />
<text class="pmc-label" x="147.4" y="308.3">Molecular Oxygen (O2)</text>
<text class="pmc-sub" x="147.4" y="323.3">electron acceptor</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_I_CORE"><rect class="pmc-node tier-T1" x="278.8" y="130.0" width="229.5" height="60.6" />
<text class="pmc-label" x="393.5" y="148.3">Complex I (Catalytic Core)</text>
<text class="pmc-sub" x="393.5" y="163.3">14 conserved subunits • 8 × Fe/S •</text>
<text class="pmc-sub" x="393.5" y="175.3">FMN</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_I_CA_DOMAIN"><rect class="pmc-node tier-T1" x="278.8" y="222.6" width="225.2" height="60.6" />
<text class="pmc-label" x="391.4" y="240.9">Complex I CA Domain</text>
<text class="pmc-sub" x="391.4" y="255.9">CAL1/CAL2/CA1-3 • plant-specific •</text>
<text class="pmc-sub" x="391.4" y="267.9">absent in mammals</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_II_SDH"><rect class="pmc-node tier-T1" x="278.8" y="315.2" width="161.4" height="48.1" />
<text class="pmc-label" x="359.4" y="333.3">Complex II (SDH)</text>
<text class="pmc-sub" x="359.4" y="348.3">SDH1-4 • FAD • 3 × Fe/S</text>
</g>
<g class="pmc-node-group" id="node-ALT_NDH_INTERNAL"><rect class="pmc-node tier-T1" x="278.8" y="395.4" width="213.6" height="60.6" />
<text class="pmc-label" x="385.6" y="413.7">Internal Type II NDH</text>
<text class="pmc-sub" x="385.6" y="428.7">NDA1/NDA2/NDC1 • matrix-facing •</text>
<text class="pmc-sub" x="385.6" y="440.7">bypass</text>
</g>
<g class="pmc-node-group" id="node-ALT_NDH_EXTERNAL"><rect class="pmc-node tier-T1" x="278.8" y="488.0" width="236.8" height="48.1" />
<text class="pmc-label" x="397.1" y="506.1">External Type II NDH</text>
<text class="pmc-sub" x="397.1" y="521.1">NDB1/NDB2/NDB4 • IMS-facing • bypass</text>
</g>
<g class="pmc-node-group" id="node-UBIQUINONE_POOL"><rect class="pmc-node tier-T4" x="551.5" y="130.0" width="206.2" height="48.1" />
<text class="pmc-label" x="654.7" y="148.1">Ubiquinone Pool (Q/QH2)</text>
<text class="pmc-sub" x="654.7" y="163.1">membrane quinone</text>
</g>
<g class="pmc-node-group" id="node-AOX_BYPASS"><rect class="pmc-node tier-T1" x="551.5" y="210.1" width="213.6" height="76.2" />
<text class="pmc-label" x="658.3" y="228.8">Alternative Oxidase</text>
<text class="pmc-label" x="658.3" y="243.8">(AOX1a)</text>
<text class="pmc-sub" x="658.3" y="258.8">di-iron carboxylate •</text>
<text class="pmc-sub" x="658.3" y="270.8">cyanide-resistant • no H+ pumped</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_III_BC1"><rect class="pmc-node tier-T1" x="801.1" y="130.0" width="236.8" height="60.6" />
<text class="pmc-label" x="919.5" y="148.3">Complex III (bc1 Complex)</text>
<text class="pmc-sub" x="919.5" y="163.3">Rieske [2Fe-2S] • Cyt b • Cyt c1 • Q</text>
<text class="pmc-sub" x="919.5" y="175.3">cycle</text>
</g>
<g class="pmc-node-group" id="node-CYTOCHROME_C"><rect class="pmc-node tier-T4" x="801.1" y="222.6" width="132.4" height="48.1" />
<text class="pmc-label" x="867.3" y="240.7">Cytochrome c</text>
<text class="pmc-sub" x="867.3" y="255.7">mobile IMS carrier</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_IV_COX"><rect class="pmc-node tier-T1" x="801.1" y="302.8" width="202.0" height="48.1" />
<text class="pmc-label" x="902.1" y="320.8">Complex IV (COX)</text>
<text class="pmc-sub" x="902.1" y="335.8">heme a3/CuB • terminal oxidase</text>
</g>
<g class="pmc-node-group" id="node-COMPLEX_V_ATPASE"><rect class="pmc-node tier-T1" x="1073.9" y="130.0" width="175.2" height="48.1" />
<text class="pmc-label" x="1161.6" y="148.1">ATP Synthase (F1Fo)</text>
<text class="pmc-sub" x="1161.6" y="163.1">H+ motor • yields ATP</text>
</g>
<g class="pmc-node-group" id="node-PUMP_UNCOUPLING"><rect class="pmc-node tier-T1" x="1073.9" y="210.1" width="207.8" height="48.1" />
<text class="pmc-label" x="1177.8" y="228.2">Plant UCP1 (PUMP1)</text>
<text class="pmc-sub" x="1177.8" y="243.2">dissipates H+ • thermotolerance</text>
</g>
<g class="pmc-node-group" id="node-MITO_ROS_BURST"><rect class="pmc-node tier-T1" x="1073.9" y="290.2" width="196.2" height="76.2" />
<text class="pmc-label" x="1172.0" y="308.9">Mitochondrial</text>
<text class="pmc-label" x="1172.0" y="323.9">Superoxide/H2O2</text>
<text class="pmc-sub" x="1172.0" y="338.9">retrograde signal • leak from</text>
<text class="pmc-sub" x="1172.0" y="350.9">CI/CIII</text>
</g>
<g class="pmc-node-group" id="node-DTC_CITRATE_CARRIER"><rect class="pmc-node tier-T1" x="1073.9" y="398.5" width="190.4" height="60.6" />
<text class="pmc-label" x="1169.1" y="416.8">DTC Translocator</text>
<text class="pmc-sub" x="1169.1" y="431.8">exports citrate • epigenetic</text>
<text class="pmc-sub" x="1169.1" y="443.8">signaling</text>
</g>
</svg>