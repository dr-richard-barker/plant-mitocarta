<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1439.7 650.0" width="1439.7" height="650.0" class="pmc-svg" data-theme="light">
<style>
:root {
  --pmc-bg: #ffffff;
  --pmc-ink: #111827;
  --pmc-ink-soft: #4b5563;
  --pmc-node-fill: #f9fafb;
  --pmc-node-stroke: #111827;
  --pmc-hairline: #9ca3af;
  --pmc-edge: #4b5563;
  --pmc-card-bg: #ffffff;
  --pmc-compartment-fill: rgba(0, 0, 0, 0.03);
}
:root[data-theme="dark"], body.dark-mode {
  --pmc-bg: #0b0f19;
  --pmc-ink: #f3f4f6;
  --pmc-ink-soft: #9ca3af;
  --pmc-node-fill: #151d2e;
  --pmc-node-stroke: #f3f4f6;
  --pmc-hairline: #4b5563;
  --pmc-edge: #9ca3af;
  --pmc-card-bg: #111827;
  --pmc-compartment-fill: rgba(255, 255, 255, 0.04);
}

.pmc-canvas { fill: var(--pmc-bg); }
text { font-family: 'DejaVu Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: var(--pmc-ink); }
.pmc-title { font-size: 20px; font-weight: 700; }
.pmc-subtitle { font-size: 13px; fill: var(--pmc-ink-soft); }
.pmc-caption { font-size: 11.5px; fill: var(--pmc-ink-soft); }
.pmc-label { font-size: 12.5px; font-weight: 600; text-anchor: middle; }
.pmc-sub { font-size: 10px; fill: var(--pmc-ink-soft); text-anchor: middle; }

.pmc-node { fill: var(--pmc-node-fill); stroke: var(--pmc-node-stroke); rx: 6px; ry: 6px; }

/* Evidence Tiers as Border Channels */
.tier-T1 { stroke-width: 3.0px; stroke: var(--pmc-node-stroke); }
.tier-T2 { stroke-width: 1.8px; stroke: var(--pmc-node-stroke); }
.tier-T3 { stroke-width: 1.8px; stroke-dasharray: 6 4; stroke: var(--pmc-node-stroke); }
.tier-T4 { stroke-width: 1.5px; stroke-dasharray: 2 3; stroke: var(--pmc-ink-soft); }
.tier-T5 { stroke-width: 0.8px; stroke: var(--pmc-hairline); }

.pmc-compartment { fill: var(--pmc-compartment-fill); stroke-width: 1.5px; stroke-dasharray: 4 4; rx: 12px; }
.pmc-compartment-label { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; fill: var(--pmc-ink-soft); }

.pmc-edge { fill: none; stroke: var(--pmc-edge); stroke-width: 1.6px; }
.pmc-edge-electron_transfer { stroke: #0072B2; stroke-width: 2.2px; }
.pmc-edge-metabolite_flux { stroke: #009E73; stroke-width: 1.8px; stroke-dasharray: 4 3; }
.pmc-edge-activates { stroke: #E69F00; stroke-width: 1.8px; }
.pmc-edge-inhibits { stroke: #D55E00; stroke-width: 2.0px; }
.pmc-edge-cleaved_by { stroke: #CC79A7; stroke-dasharray: 5 3; }
.pmc-edge-label { font-size: 9.5px; fill: var(--pmc-ink-soft); font-weight: 500; text-anchor: middle; }
</style>
<defs>
<marker id="pmc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="var(--pmc-edge)" /></marker>
<marker id="pmc-arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#0072B2" /></marker>
<marker id="pmc-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#009E73" /></marker>
<marker id="pmc-arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#E69F00" /></marker>
<marker id="pmc-arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#D55E00" /></marker>
<marker id="pmc-inhibit" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><line x1="5" y1="1" x2="5" y2="9" stroke="#D55E00" stroke-width="2.5" /></marker>
</defs>
<rect class="pmc-canvas" width="1439.7" height="650.0" />
<text class="pmc-title" x="32" y="44">Integrated Multi-Organelle Digital Double Atlas</text>
<text class="pmc-subtitle" x="32" y="66">The unified plant cell: Mitochondrion, Chloroplast, Nucleus, and Plasma Membrane bound by retrograde signaling, metabolic shuttles, and systemic waves.</text>
<rect class="pmc-compartment" x="24.0" y="90.0" width="293.2" height="332.6" stroke="#1d4e6b" />
<text class="pmc-compartment-label" x="36.0" y="108.0">Plasma Membrane</text>
<rect class="pmc-compartment" x="297.2" y="90.0" width="293.2" height="292.0" stroke="#0b5c46" />
<text class="pmc-compartment-label" x="309.2" y="108.0">Chloroplast</text>
<rect class="pmc-compartment" x="570.5" y="90.0" width="281.2" height="144.2" stroke="#6b5a06" />
<text class="pmc-compartment-label" x="582.5" y="108.0">Peroxisome (Photorespiratory nexus)</text>
<rect class="pmc-compartment" x="831.7" y="90.0" width="301.0" height="288.9" stroke="#7a4a12" />
<text class="pmc-compartment-label" x="843.7" y="108.0">Mitochondrion</text>
<rect class="pmc-compartment" x="1112.7" y="90.0" width="287.0" height="301.4" stroke="#4a2a55" />
<text class="pmc-compartment-label" x="1124.7" y="108.0">Nucleus</text>
<line class="pmc-edge pmc-edge-activates" x1="167.5" y1="206.2" x2="143.5" y2="330.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="155.5" y="264.6">mechanical stretch gates Ca2+</text>
<line class="pmc-edge pmc-edge-activates" x1="143.5" y1="330.9" x2="170.6" y2="298.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="157.1" y="310.9">CPK phosphorylation activates RBOHD</text>
<line class="pmc-edge pmc-edge-activates" x1="235.0" y1="362.8" x2="325.2" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="280.1" y="254.4">calcium wave entry</text>
<line class="pmc-edge pmc-edge-activates" x1="235.0" y1="362.8" x2="859.7" y2="160.3" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="547.4" y="257.5">calcium uptake via MCU</text>
<line class="pmc-edge pmc-edge-activates" x1="289.2" y1="268.6" x2="325.2" y2="329.9" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="307.2" y="295.2">H2O2 enters via PIP2;1 -&gt; oxidizes SAL1</text>
<line class="pmc-edge pmc-edge-activates" x1="289.2" y1="268.6" x2="859.7" y2="326.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="574.5" y="293.7">H2O2 activates rhomboid cleavage</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="550.5" y1="242.0" x2="598.5" y2="168.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="574.5" y="201.1">glycolate exported via PLGG1</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="823.7" y1="168.1" x2="859.7" y2="246.7" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="841.7" y="203.4">glycine enters mitochondria</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="859.7" y1="246.7" x2="823.7" y2="168.1" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="841.7" y="203.4">serine returns to peroxisome</text>
<line class="pmc-edge pmc-edge-metabolite_flux" x1="598.5" y1="168.1" x2="550.5" y2="242.0" marker-end="url(#pmc-arrow-green)" />
<text class="pmc-edge-label" x="574.5" y="201.1">glycerate returns to Calvin cycle</text>
<line class="pmc-edge pmc-edge-activates" x1="554.8" y1="329.9" x2="1140.7" y2="240.4" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="847.7" y="281.2">PAP &amp; GUN1 signal to ABI4</text>
<line class="pmc-edge pmc-edge-activates" x1="1104.7" y1="326.8" x2="1140.7" y2="154.1" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1122.7" y="236.4">cleaved ANAC017 binds MDRE</text>
<line class="pmc-edge pmc-edge-activates" x1="1250.4" y1="178.1" x2="1247.5" y2="302.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1249.0" y="236.4">induces stress proteome</text>
<line class="pmc-edge pmc-edge-activates" x1="1256.2" y1="270.8" x2="1247.5" y2="302.8" marker-end="url(#pmc-arrow-orange)" />
<text class="pmc-edge-label" x="1251.8" y="282.8">tunes photosynthetic capacity</text>
<g class="pmc-node-group" id="node-PM_SENSORY_INPUT"><rect class="pmc-node tier-T1" x="52.0" y="130.0" width="231.0" height="76.2" />
<text class="pmc-label" x="167.5" y="148.6">PM Mechanical/Gravity</text>
<text class="pmc-label" x="167.5" y="163.6">Sensors</text>
<text class="pmc-sub" x="167.5" y="178.6">FERONIA, WAK1, MSL10 • detects wall</text>
<text class="pmc-sub" x="167.5" y="190.6">strain</text>
</g>
<g class="pmc-node-group" id="node-PM_RBOHD_BURST"><rect class="pmc-node tier-T1" x="52.0" y="238.2" width="237.2" height="60.6" />
