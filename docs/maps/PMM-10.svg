</g>
<g class="pmc-node-group" id="node-CHLORO_PHOTOSYSTEMS"><rect class="pmc-node tier-T1" x="325.2" y="130.0" width="237.2" height="48.1" />
<text class="pmc-label" x="443.9" y="148.1">Chloroplast Light Reactions</text>
<text class="pmc-sub" x="443.9" y="163.1">PSII, PSI, Cyt b6f, ATP synthase</text>
</g>
<g class="pmc-node-group" id="node-CHLORO_RUBISCO"><rect class="pmc-node tier-T1" x="325.2" y="210.1" width="225.2" height="63.8" />
