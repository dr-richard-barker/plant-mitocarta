# Plant MitoCarta & Organelle Ontology (PMCO) Core Specification
# Grounded in GO Cellular Component (GO-CCO) and Subcellular Anatomy Ontology (SAO)
# Reference: Roncaglia et al. 2013 (PMC3852282)

name: Plant MitoCarta & Organelle Ontology
acronym: PMCO
version: "0.1.0"
date: "2026-09-29"
license: CC-BY-4.0
description: >-
  Controlled vocabulary for plant subcellular bioenergetics, four organellar digital
  doubles (Mitochondrion, Chloroplast, Nucleus, Plasma Membrane), retrograde signaling
  circuits, membrane contact sites, and cross-species mammalian MitoCarta comparison.

# ---------------------------------------------------------------------------
# Evidence Tiers
# ---------------------------------------------------------------------------
evidence_tiers:
  - id: T1
    label: Demonstrated Empirical (Plant)
    definition: >-
      Direct empirical measurement of the entity's presence, activity, flux, or
      translocation in Arabidopsis thaliana. Requires at least one resolved DOI
      in evidence.
    border_style: solid_heavy
    border_width: 3.0
    doi_required: true

  - id: T2
    label: Inferred from Pathway/Process (Plant)
    definition: >-
      Demonstrated for the containing multi-protein complex, organellar fraction,
      or metabolic pathway in plants, but not isolated directly to this single node.
      Requires at least one resolved DOI in evidence.
    border_style: solid_light
    border_width: 1.5
    doi_required: true

  - id: T3
    label: Orthology-Inferred (Mammalian/Yeast)
    definition: >-
      Inferred from human or mouse Broad MitoCarta 3.0 or yeast homologs with no
      direct plant biochemical assay. A cross-species inference.
    border_style: dashed
    border_width: 2.0
    dash_array: "4 3"
    doi_required: false

  - id: T4
    label: Mechanistic Hypothesis / Computational Prediction
    definition: >-
      Hypothesized physical route, predicted membrane contact site, candidate
      retrograde messenger, or SUBAcon computational prediction.
    border_style: dotted
    border_width: 1.5
    dash_array: "2 2"
    doi_required: false

  - id: T5
    label: Anatomical & Topological Context
    definition: >-
      Structural or spatial context (membranes, cristae, pores, compartments).
      No quantum or biochemical claim made on this node.
    border_style: hairline
    border_width: 0.75
    doi_required: false

