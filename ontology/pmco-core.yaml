# ---------------------------------------------------------------------------
# Spatial & Functional Relations (PMC3852282 Formalisms)
# ---------------------------------------------------------------------------
relations:
  - id: part_of
    obo_id: "BFO:0000050"
    label: "part of"
    definition: "Mereological containment: structure is a physical component of parent."

  - id: has_part
    obo_id: "BFO:0000051"
    label: "has part"
    definition: "Compositional requirement: parent structure necessarily contains component."

  - id: is_a
    label: "is a"
    definition: "Taxonomic subsumption: child term is a specialized subtype of parent."

  - id: occurs_in
    obo_id: "BFO:0000062"
    label: "occurs in"
    definition: "Spatial localization: process takes place within specified compartment."

  - id: has_start_location
    obo_id: "RO:0002338"
    label: "has start location"
    definition: "Origin of translocation or vector transport."

  - id: has_target_end_location
    obo_id: "RO:0002339"
    label: "has target end location"
    definition: "Destination of retrograde signaling translocation."

  - id: interacts_at_contact_site
    label: "interacts at contact site"
    definition: "Physical proximity and exchange across non-vesicular membrane contact."

  - id: cleaved_by
    label: "cleaved by"
    definition: "Proteolytic cleavage triggering release of signaling domain."

  - id: activates
    obo_id: "RO:0002448"
    label: "directly activates"
    definition: "Positive regulation of target enzyme, channel, or promoter."

  - id: inhibits
    obo_id: "RO:0002449"
    label: "directly inhibits"
    definition: "Negative regulation or enzymatic inhibition."

  - id: electron_transfer
    label: "electron transfer"
    definition: "Redox electron transfer between prosthetic groups or complexes."

  - id: metabolite_flux
    label: "metabolite flux"
    definition: "Substrate or product transport across membranes or enzymatic steps."
