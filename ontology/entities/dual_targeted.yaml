# PMCO Entities: Dual-Targeted Proteins
# Demonstrating dual localization between Mitochondria and Chloroplasts, or Mitochondria and Nucleus.
# Distinct from human MitoCarta 3.0 where these proteins are strictly mitochondrial.

- id: PMCO:POLIA_POLYMERASE
  label: "Organellar DNA Polymerase 1A (PolIA)"
  kind: macromolecule
  compartment: mitochondrial_matrix
  evidence_tier: T1
  description: >-
    Family A DNA polymerase responsible for organellar genome replication. Dual-targeted
    to both mitochondria and chloroplasts via an ambiguous N-terminal transit peptide.
    Contrast with human POLG, which is strictly mitochondrial.
  xref:
    agi: ["AT1G50840"]
    uniprot: ["Q9S7N4"]
    ec: ["2.7.7.7"]
    go_cc: ["GO:0005739", "GO:0009507"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.85
    ms_evidence: true
    gfp_evidence: true
    dual_targeted: true
    dual_compartments: ["mitochondrion", "chloroplast"]
  mitocarta:
    human_symbol: "POLG"
    mitopathway: "Mitochondrial Central Dogma > mtDNA Replication"
    conservation_category: dual_targeted_divergence
    clinical_significance: "Human POLG mutations cause Alpers syndrome, progressive external ophthalmoplegia (PEO)."
  evidence:
    - citation: "Hooper2023"
      doi: "10.1093/nar/gkac1008"
      claim: "SUBA5 dual-targeting evidence for PolIA in both mitochondria and chloroplasts."

