    uniprot: ["Q9SJG9"]
    ec: ["2.1.2.1"]
    go_cc: ["GO:0005759"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "SHMT2"
    mitopathway: "Metabolism > Folate and One-Carbon"
    conservation_category: strict_ortholog
  evidence:
    - citation: "Bauwe2010"
      doi: "10.1016/j.tplants.2010.05.006"
      claim: "SHMT1 operates in tandem with GDC in the matrix."

- id: PMCO:DTC_CARRIER
  label: "Dicarboxylate / Tricarboxylate Carrier (DTC)"
  kind: channel_transporter
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    Mitochondrial carrier family translocator transporting citrate, isocitrate,
    2-oxoglutarate, and malate across the inner membrane. Exports citrate for
    retrograde signaling.
  xref:
    agi: ["AT5G19760"]
    uniprot: ["Q9SR63"]
    go_cc: ["GO:0005743"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.98
    ms_evidence: true
  mitocarta:
    human_symbol: "SLC25A1"
    mitopathway: "Small Molecule Transport > Citrate Transporter"
    conservation_category: strict_ortholog
  retrograde:
    circuit: mrr_mito_nuclear
    role: "Exports matrix citrate and 2-oxoglutarate to cytosol/nucleus"
    signal_type: metabolite
  evidence:
    - citation: "Ng2013"
      doi: "10.1104/pp.114.238493"
      claim: "TCA cycle intermediates act as retrograde signals via carrier-mediated export."

- id: PMCO:MITO_ROS
  label: "Mitochondrial ROS Pool (Superoxide & H2O2)"
  kind: simple_chemical
  compartment: cristae
  evidence_tier: T1
  description: >-
    Superoxide generated by Complex I FMN, Complex III Qo site, and converted by Mn-SOD
    (MSD1) into hydrogen peroxide, diffusing through channels to trigger retrograde signaling.
  xref:
    chebi: ["CHEBI:15379", "CHEBI:16240"]
  retrograde:
    circuit: mrr_mito_nuclear
    role: "Second messenger activating rhomboid proteases to cleave ANAC017"
    signal_type: reactive_oxygen_species
  evidence:
    - citation: "DeClercq2013"
      doi: "10.1105/tpc.113.112011"
      claim: "Mitochondrial ROS triggers ANAC017 cleavage and nuclear migration."
