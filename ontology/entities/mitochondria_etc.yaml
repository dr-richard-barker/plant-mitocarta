    consensus_score: 0.99
    ms_evidence: true
  mitocarta:
    human_symbol: "COX1"
    mitopathway: "OXPHOS > Complex IV"
    conservation_category: strict_ortholog
  evidence:
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "Conserved Complex IV terminal oxidase."

- id: PMCO:COMPLEX_V
  label: "Complex V (ATP Synthase / F1Fo-ATPase)"
  kind: complex
  compartment: cristae
  evidence_tier: T1
  description: >-
    Rotary motor utilizing proton motive force to synthesize ATP from ADP and Pi.
  xref:
    agi: ["ATMG01190", "AT2G07698", "AT5G08680"]
    ec: ["7.1.2.2"]
    go_cc: ["GO:0005753"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "ATP5F1A"
    mitopathway: "OXPHOS > Complex V"
    conservation_category: strict_ortholog
  evidence:
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "Conserved ATP synthase machinery."

- id: PMCO:AOX1A
  label: "Alternative Oxidase 1A (AOX1a)"
  kind: macromolecule
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    Cyanide-resistant, non-proton-pumping terminal quinol oxidase. Directly transfers
    electrons from ubiquinol to oxygen. Acts as a key bioenergetic relief valve and
    hallmark target of mitochondrial retrograde signaling (MRR). Absent in mammals.
  xref:
    agi: ["AT3G22370"]
    uniprot: ["O22049"]
    ec: ["1.10.3.11"]
    go_cc: ["GO:0005743"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
    dual_targeted: false
  mitocarta:
    conservation_category: plant_specific_innovation
    mitopathway: "OXPHOS > Alternative Oxidase Bypass"
    clinical_significance: "Absent in mammals; heterologous expression in human cells rescues Complex I/III defects."
  retrograde:
    circuit: mrr_mito_nuclear
    role: "Primary transcriptional readout of mitochondrial dysfunction (ANAC017 target)"
    signal_type: promoter_element
  evidence:
    - citation: "Maxwell1999"
      doi: "10.1073/pnas.96.14.8271"
      claim: "AOX lowers mitochondrial reactive oxygen species in plant cells."
    - citation: "DeClercq2013"
      doi: "10.1105/tpc.113.112011"
      claim: "AOX1a is directly induced by ANAC017 binding to the MDRE promoter element."

- id: PMCO:ALT_NADH_DH_INT
  label: "Internal Type II NAD(P)H Dehydrogenases (NDA1, NDA2, NDC1)"
  kind: complex
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    Rotenone-insensitive, non-proton-pumping NADH dehydrogenases facing the mitochondrial
    matrix. Allows NADH oxidation without ATP production. Absent in mammalian MitoCarta.
  xref:
    agi: ["AT1G07180", "AT2G29990", "AT5G08740"]
    uniprot: ["Q949U2", "Q9M8S0"]
    ec: ["1.6.99.3"]
    go_cc: ["GO:0005743"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.96
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    conservation_category: plant_specific_innovation
    mitopathway: "OXPHOS > Alternative NADH Dehydrogenase Bypass"
  evidence:
    - citation: "VanAken2016"
      doi: "10.1104/pp.16.01223"
      claim: "Alternative internal dehydrogenases bypass Complex I during stress."

- id: PMCO:ALT_NADH_DH_EXT
  label: "External Type II NAD(P)H Dehydrogenases (NDB1, NDB2, NDB4)"
  kind: complex
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    Rotenone-insensitive dehydrogenases facing the intermembrane space, directly
    oxidizing cytosolic NADH/NADPH. Absent in mammals.
  xref:
    agi: ["AT4G05020", "AT4G28220", "AT2G20800"]
    uniprot: ["Q9SRW4", "Q9FKY6"]
    ec: ["1.6.99.3"]
    go_cc: ["GO:0005743"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.97
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    conservation_category: plant_specific_innovation
    mitopathway: "OXPHOS > External NADH Dehydrogenase Bypass"
  evidence:
    - citation: "VanAken2016"
      doi: "10.1104/pp.16.01223"
      claim: "NDB2 is strongly induced under mitochondrial stress alongside AOX1a."

- id: PMCO:PUMP1
  label: "Plant Uncoupling Protein 1 (PUMP1 / UCP1)"
  kind: channel_transporter
  compartment: cristae
  evidence_tier: T1
