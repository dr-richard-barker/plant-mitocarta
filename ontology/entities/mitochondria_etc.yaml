    Mitochondrial carrier that dissipates the proton gradient as heat, uncoupling
    electron transport from ATP synthesis.
  xref:
    agi: ["AT3G54110"]
    uniprot: ["Q9XF72"]
    go_cc: ["GO:0005743"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "SLC25A7"
    mitopathway: "Small Molecule Transport > Uncoupling Proteins"
    conservation_category: strict_ortholog
  evidence:
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "Conserved uncoupling protein family (SLC25A7 / UCP1)."

- id: PMCO:GDC_COMPLEX
  label: "Glycine Decarboxylase Complex (GDC P-, T-, H-, L-proteins)"
  kind: complex
  compartment: mitochondrial_matrix
  evidence_tier: T1
  description: >-
    Massive multi-enzyme complex (~half of soluble matrix protein in photosynthetic
    leaves) catalyzing glycine decarboxylation in photorespiration. Tightly linked
    to chloroplast RuBisCO flux.
  xref:
    agi: ["AT4G33010", "AT1G11860", "AT2G35370", "AT1G38040"]
    uniprot: ["Q9LYT2", "Q9SAR0", "P25850"]
    ec: ["1.4.4.2"]
    go_cc: ["GO:0005960"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "GLDC"
    mitopathway: "Metabolism > Glycine Cleavage"
    conservation_category: strict_ortholog
    clinical_significance: "Human mutations cause non-ketotic hyperglycinemia."
  retrograde:
    circuit: photorespiratory_conduit
    role: "Matrix engine of the 3-organelle photorespiratory loop (yields serine, NADH, CO2)"
    signal_type: metabolite
  evidence:
    - citation: "Bauwe2010"
      doi: "10.1016/j.tplants.2010.05.006"
      claim: "Central role of GDC in plant photorespiration and organelle crosstalk."

