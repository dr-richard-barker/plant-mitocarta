# PMCO Entities: Plant Mitochondrion (Plant MitoCarta)
# Featuring core OXPHOS, plant-specific bypasses (AOX, Type II NDHs, CA domain),
# photorespiration (GDC), TCA cycle, and retrograde initiators.

- id: PMCO:COMPLEX_I
  label: "Mitochondrial Complex I (NADH:ubiquinone oxidoreductase)"
  kind: complex
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    L-shaped multisubunit respiratory complex (~40 subunits) pumping protons across
    the inner membrane. Contains 14 conserved central subunits homologous to human
    MitoCarta Complex I.
  xref:
    agi: ["AT5G08530", "AT5G37510", "AT1G79010", "AT1G16700"]
    uniprot: ["Q9M7X3", "Q9FLA8", "Q9M342"]
    ec: ["1.6.5.3"]
    go_cc: ["GO:0005747"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
    dual_targeted: false
  mitocarta:
    human_symbol: "NDUFA9"
    mitopathway: "OXPHOS > Complex I"
    conservation_category: strict_ortholog
    clinical_significance: "Mutations cause Leigh syndrome and mitochondrial encephalomyopathy."
  evidence:
    - citation: "Roncaglia2013"
      doi: "10.1186/2041-1480-4-20"
      claim: "GO-CCO localization to mitochondrial inner membrane."
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "MitoCarta 3.0 core Complex I pathway."

- id: PMCO:COMPLEX_I_CA
  label: "Complex I Carbonic Anhydrase Domain"
  kind: complex
  compartment: cristae
  evidence_tier: T1
  description: >-
    Plant-specific heterotrimeric spherical domain (CAL1, CAL2, CA1, CA2, CA3) attached
    to the matrix side of the membrane arm of Complex I. Crucial for complex assembly,
    stability, and photorespiration. Completely absent from mammalian MitoCarta.
  xref:
    agi: ["AT1G47260", "AT3G48680", "AT1G19580", "AT5G63510", "AT5G66510"]
    uniprot: ["Q9SZF1", "Q93VT7", "Q9LVK4"]
    go_cc: ["GO:0005747"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.98
    ms_evidence: true
    gfp_evidence: true
    dual_targeted: false
  mitocarta:
    conservation_category: plant_specific_innovation
    mitopathway: "OXPHOS > Complex I Plant Innovation"
    clinical_significance: "Plant-specific innovation absent in mammals; essential for assembly."
  evidence:
    - citation: "Fromm2016"
      doi: "10.1104/pp.16.00940"
      claim: "Carbonic anhydrase domain is required for plant Complex I assembly and stability."

- id: PMCO:COMPLEX_II
  label: "Complex II (Succinate Dehydrogenase / SDH)"
  kind: complex
  compartment: mitochondrial_inner_membrane
  evidence_tier: T1
  description: >-
    Heterotetrameric complex (SDH1-4) coupling succinate oxidation to ubiquinone reduction
    without proton translocation. Highly conserved with human SDHA/B/C/D.
  xref:
    agi: ["AT5G66760", "AT3G27380", "AT5G40650", "AT3G46620"]
    uniprot: ["Q9SUT2", "Q9FKA6"]
    ec: ["1.3.5.1"]
    go_cc: ["GO:0005749"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "SDHA"
    mitopathway: "OXPHOS > Complex II"
    conservation_category: strict_ortholog
    clinical_significance: "Human mutations cause paraganglioma and Leigh syndrome."
  evidence:
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "Core conserved Complex II subunits in human MitoCarta 3.0."

- id: PMCO:COMPLEX_III
  label: "Complex III (Cytochrome bc1 Complex / Ubiquinol-Cytochrome c Reductase)"
  kind: complex
  compartment: cristae
  evidence_tier: T1
  description: >-
    Dimeric complex containing cytochrome b, cytochrome c1, and the Rieske [2Fe-2S]
    protein, mediating Q-cycle proton translocation.
  xref:
    agi: ["AT5G13440", "AT3G27240", "AT4G32470"]
    uniprot: ["Q9S838", "Q944V2"]
    ec: ["1.10.2.2"]
    go_cc: ["GO:0005750"]
  suba5:
    consensus_compartment: "mitochondrion"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  mitocarta:
    human_symbol: "UQCRFS1"
    mitopathway: "OXPHOS > Complex III"
    conservation_category: strict_ortholog
  evidence:
    - citation: "Rath2021"
      doi: "10.1093/nar/gkaa1011"
      claim: "Core conserved Complex III subunits."

- id: PMCO:COMPLEX_IV
  label: "Complex IV (Cytochrome c Oxidase / COX)"
  kind: complex
  compartment: cristae
  evidence_tier: T1
  description: >-
    Terminal oxidase of the cytochrome pathway reducing O2 to 2 H2O and pumping protons
    into the IMS.
  xref:
    agi: ["ATMG00160", "ATMG00290", "AT5G44300"]
    ec: ["1.9.3.1"]
    go_cc: ["GO:0005751"]
  suba5:
