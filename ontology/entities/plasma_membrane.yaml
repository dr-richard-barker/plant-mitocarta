# PMCO Entities: Plasma Membrane Digital Double
# Featuring sensory receptor kinases (FERONIA, WAK1), mechanosensitive channels (MSL10),
# calcium flux gates (GLR3.3/3.6), the ROS wave generator (RBOHD), and aquaporins (PIP2;1).

- id: PMCO:RBOHD_NADPH_OXIDASE
  label: "Respiratory Burst Oxidase Homolog D (RBOHD)"
  kind: macromolecule
  compartment: plasma_membrane
  evidence_tier: T1
  description: >-
    Plasma membrane NADPH oxidase generating apoplastic superoxide. Activated by
    cytosolic calcium binding to EF-hands and phosphorylation by CPKs/BIK1, driving
    rapid systemic ROS waves that connect to intracellular organelles.
  xref:
    agi: ["AT5G47910"]
    uniprot: ["Q9FIJ0"]
    ec: ["1.6.3.1"]
    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Generates apoplastic superoxide waves triggered by mechanical strain or microgravity"
    signal_type: reactive_oxygen_species
  evidence:
    - citation: "Miller2009"
      doi: "10.1126/scisignal.2000448"
      claim: "RBOHD drives rapid systemic reactive oxygen species waves."

- id: PMCO:FERONIA_RLK
  label: "FERONIA Receptor Kinase (FER)"
  kind: receptor_kinase
  compartment: plasma_membrane
  evidence_tier: T1
  description: >-
    Catharanthus roseus RLK1-like (CrRLK1L) family receptor kinase sensing cell wall
    integrity, mechanical deformation, and peptide ligands (RALF). Triggers rapid
    calcium influx and activates RBOHD.
  xref:
    agi: ["AT3G51550"]
    uniprot: ["Q9DG60"]
    ec: ["2.7.11.1"]
    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Perception of cell wall strain and mechanical perturbation"
    signal_type: kinase
  evidence:
    - citation: "Toyota2018"
      doi: "10.1126/science.aat7744"
      claim: "Cell wall receptor kinases initiate downstream calcium and ROS waves."

- id: PMCO:WAK1_RECEPTOR
  label: "Wall-Associated Kinase 1 (WAK1)"
  kind: receptor_kinase
  compartment: plasma_membrane
  evidence_tier: T1
  description: >-
    Receptor kinase spanning the plasma membrane with an extracellular domain physically
    bound to pectin in the cell wall, monitoring wall strain and microgravity-induced stresses.
  xref:
    agi: ["AT1G21250"]
    uniprot: ["Q38867"]
    ec: ["2.7.11.1"]
    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.98
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Mechanical sensor of pectin stretching and apoplastic stress"
    signal_type: kinase
  evidence:
    - citation: "Roncaglia2013"
      doi: "10.1186/2041-1480-4-20"
      claim: "Plasma membrane receptor kinase integration in GO-CCO."

- id: PMCO:GLR3_3_CHANNEL
