    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Direct sensor of membrane mechanical stretch and microgravity-induced turgor changes"
    signal_type: channel
  evidence:
    - citation: "Toyota2018"
      doi: "10.1126/science.aat7744"
      claim: "Mechanosensitive channels initiate cellular calcium influx."

- id: PMCO:PIP2_1_AQUAPORIN
  label: "Plasma Membrane Intrinsic Protein 2;1 (PIP2;1)"
  kind: channel_transporter
  compartment: plasma_membrane
  evidence_tier: T1
  description: >-
    Aquaporin channel facilitating the transport of both water and hydrogen peroxide
    (H2O2) across the plasma membrane, allowing apoplastic ROS generated by RBOHD
    to enter the cytosol.
  xref:
    agi: ["AT3G53420"]
    uniprot: ["P43286"]
    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Facilitates inward transport of apoplastic H2O2 into the cytosol"
    signal_type: channel
  evidence:
    - citation: "Miller2009"
      doi: "10.1126/scisignal.2000448"
      claim: "Aquaporins channel apoplastic ROS waves into the intracellular cytoplasm."

