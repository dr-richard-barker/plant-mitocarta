    Non-selective cation channel mediating rapid calcium influx from the apoplast,
    propagating long-distance electrical and calcium signals to internal organelles.
  xref:
    agi: ["AT2G24730"]
    uniprot: ["Q9C661"]
    go_cc: ["GO:0005886"]
  suba5:
    consensus_compartment: "plasma_membrane"
    consensus_score: 0.99
    ms_evidence: true
    gfp_evidence: true
  retrograde:
    circuit: pm_to_organelle_wave
    role: "Propagates rapid calcium waves from plasma membrane to internal organelles"
    signal_type: calcium_ion
  evidence:
    - citation: "Toyota2018"
      doi: "10.1126/science.aat7744"
      claim: "GLR3.3 and GLR3.6 channels propagate rapid calcium waves throughout the plant."

