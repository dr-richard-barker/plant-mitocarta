# PMCO Entities: Contact Sites, Inter-Organellar Junctions & Metabolic Links
# Featuring Stromule-nuclear contacts, MEAMs, and the Peroxisomal photorespiratory bridge.

- id: PMCO:STROMULE_NUCLEAR_CONTACT
  label: "Stromule-to-Nuclear Envelope Docking Site"
  kind: contact_site
  compartment: stromule
  evidence_tier: T1
  description: >-
    Dynamic stroma-filled tubular extension from chloroplasts that extends along
    actin filaments to physically wrap around and dock at the nuclear envelope,
    delivering H2O2 directly into the nucleoplasm without cytosolic dilution.
  retrograde:
    circuit: membrane_contact_site
    role: "Direct structural channel for concentrated H2O2 transfer to the nucleus"
    signal_type: reactive_oxygen_species
  evidence:
    - citation: "Caplan2015"
      doi: "10.1016/j.devcel.2015.05.011"
      claim: "Chloroplast stromules connect to the nucleus to channel H2O2 during plant defense and stress."

- id: PMCO:MEAM_CONTACT_SITE
  label: "Mitochondria-ER Associated Membrane (MEAM)"
  kind: contact_site
  compartment: mitochondria_er_contact_site_MEAM
  evidence_tier: T1
  description: >-
    Non-vesicular lipid and ion exchange junction between the outer mitochondrial
    membrane and endoplasmic reticulum, anchored by VAP27 and tethering complexes.
  evidence:
    - citation: "Roncaglia2013"
      doi: "10.1186/2041-1480-4-20"
      claim: "Subcellular contact site and membrane junction modeling."

- id: PMCO:PEROXISOME_PHOTORESP
  label: "Peroxisomal Photorespiration Complex (GOX, GGT, HPR, CAT2)"
  kind: complex
  compartment: peroxisome
  evidence_tier: T1
  description: >-
    Enzyme cluster converting chloroplast-derived glycolate into glyoxylate (producing
    H2O2 scavenged by CAT2), transaminating it to glycine for mitochondrial GDC,
    and receiving mitochondrial serine to produce glycerate.
  xref:
    agi: ["AT3G14420", "AT1G23310", "AT1G68010", "AT4G35090"]
    ec: ["1.1.3.15", "2.6.1.45", "1.1.1.29"]
    go_cc: ["GO:0005777"]
  suba5:
    consensus_compartment: "peroxisome"
    consensus_score: 0.99
    ms_evidence: true
  retrograde:
    circuit: photorespiratory_conduit
    role: "Peroxisomal bridge of the 3-organelle photorespiratory highway"
    signal_type: metabolite
  evidence:
    - citation: "Bauwe2010"
      doi: "10.1016/j.tplants.2010.05.006"
      claim: "Peroxisomal enzymes couple chloroplast glycolate to mitochondrial glycine."

- id: PMCO:PLGG1_TRANSLOCATOR
  label: "Plastidic Glycolate/Glycerate Translocator 1 (PLGG1)"
  kind: channel_transporter
  compartment: chloroplast_inner_envelope
  evidence_tier: T1
  description: >-
    Chloroplast envelope transporter exporting glycolate into the cytosol for peroxisomal
    uptake, and importing returned glycerate back into the stroma for Calvin cycle re-entry.
  xref:
    agi: ["AT1G32080"]
    uniprot: ["Q9M2F7"]
    go_cc: ["GO:0009706"]
  suba5:
    consensus_compartment: "chloroplast"
    consensus_score: 0.99
    ms_evidence: true
  retrograde:
    circuit: photorespiratory_conduit
    role: "Chloroplast gatekeeper of photorespiratory metabolite flux"
    signal_type: channel
  evidence:
    - citation: "Bauwe2010"
      doi: "10.1016/j.tplants.2010.05.006"
      claim: "PLGG1 mediates essential glycolate/glycerate transport across the plastid envelope."
